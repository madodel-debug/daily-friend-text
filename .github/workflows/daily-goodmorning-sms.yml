name: Daily Good Morning SMS
on:
  schedule:
    # Start ~20 minutes EARLY so GitHub's scheduler lag doesn't make us late.
    # The "Wait until target time" step below holds until the real send time.
    - cron: '10 21 * * 0-4'   # starts 5:10 AM PH, sends ~5:30 AM (Mon-Fri)
    - cron: '40 21 * * 5,6'   # starts 5:40 AM PH, sends ~6:00 AM (Sat-Sun)
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional: pretend today is this date (MM-DD) to test birthdays'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check monthly pause (8th-14th, except Feb 14)
        id: pause
        run: |
          export TZ=Asia/Manila
          DAY=$((10#$(date +%d)))
          MONTH=$((10#$(date +%m)))
          if [ "$MONTH" -eq 2 ] && [ "$DAY" -eq 14 ]; then
            echo "paused=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Feb 14 is exempt from the monthly pause. Sending as normal."
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$DAY" -ge 8 ] && [ "$DAY" -le 14 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Paused: day $DAY falls in the 2nd week of the month (8th-14th). Nothing will be sent."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pause.outputs.paused != 'true'

      - uses: actions/setup-python@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          python-version: '3.x'

      - run: pip install requests
        if: steps.pause.outputs.paused != 'true'

      - name: Wait until target time (plus 0-3 min jitter)
        if: github.event_name == 'schedule' && vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: |
          export TZ=Asia/Manila
          DOW=$(date +%u)   # 1=Mon ... 7=Sun, in Manila time
          if [ "$DOW" -ge 6 ]; then TARGET="06:00"; else TARGET="05:30"; fi
          NOW=$(date +%s)
          TARGET_TS=$(date -d "$(date +%F) $TARGET" +%s)
          JITTER=$(( RANDOM % 181 ))   # 0 to 3 minutes, in seconds
          WAIT=$(( TARGET_TS - NOW + JITTER ))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT second(s) until $TARGET (+jitter)"
            sleep "$WAIT"
          else
            echo "Already past $TARGET, sending right away"
          fi

      - name: Send good morning SMS
        if: vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: python send_daily_goodmorning_sms.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          BIRTHDAYS: ${{ secrets.BIRTHDAYS }}
          TEST_DATE: ${{ github.event.inputs.test_date }}

      - name: Skipped (kill switch off)
        if: vars.SMS_ENABLED != 'true'
        run: echo "::warning::SMS sending is disabled (SMS_ENABLED is not 'true'). Nothing was sent."

      - name: Save no-repeat memory back to the repo
        if: vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
