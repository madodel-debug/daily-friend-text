name: Daily Good Morning SMS
on:
  schedule:
    # Window starts are given in UTC. Philippines is UTC+8, and a start time
    # just before midnight UTC lands early the next morning in PH time, so
    # each line's weekday field is shifted back one day from the PH weekday
    # it's meant to cover.
    - cron: '30 21 * * 0-4'   # 5:30 AM PH, Mon-Fri (UTC Sun-Thu)
    - cron: '0 22 * * 5,6'    # 6:00 AM PH, Sat-Sun (UTC Fri-Sat)
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional: pretend today is this date (MM-DD) to test birthdays'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Random delay (spreads sends across the window)
        if: github.event_name == 'schedule' && vars.SMS_ENABLED == 'true'
        run: |
          if [ "${{ github.event.schedule }}" = "30 21 * * 0-4" ]; then
            MAX_MINUTES=89
            echo "Weekday run: sending sometime between 5:30 and 7:00 AM PH"
          else
            MAX_MINUTES=119
            echo "Weekend run: sending sometime between 6:00 and 8:00 AM PH"
          fi
          MINUTES=$(( RANDOM % (MAX_MINUTES + 1) ))
          echo "Sleeping $MINUTES minute(s) before sending"
          sleep "${MINUTES}m"

      - name: Send good morning SMS
        if: vars.SMS_ENABLED == 'true'
        run: python send_daily_goodmorning_sms.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          BIRTHDAYS: ${{ secrets.BIRTHDAYS }}
          TEST_DATE: ${{ github.event.inputs.test_date }}

      - name: Skipped (kill switch off)
        if: vars.SMS_ENABLED != 'true'
        run: echo "::warning::SMS sending is disabled (SMS_ENABLED is not 'true'). Nothing was sent."

      - name: Save no-repeat memory back to the repo
        if: vars.SMS_ENABLED == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
