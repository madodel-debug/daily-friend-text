name: Good Night Apology (catch-up)
on:
  schedule:
    # Start ~20 minutes EARLY so GitHub's scheduler lag doesn't push this
    # into the good-morning window. The wait step below holds until 5:00 AM.
    - cron: '40 20 * * *'   # starts 4:40 AM PH, checks ~5:00 AM
  workflow_dispatch:
    inputs:
      force_pending:
        description: 'Pretend last night was missed, for testing (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Wait until 5:00 AM PH (plus 0-10 min jitter)
        if: github.event_name == 'schedule' && vars.SMS_ENABLED == 'true'
        run: |
          export TZ=Asia/Manila
          NOW=$(date +%s)
          TARGET_TS=$(date -d "$(date +%F) 05:00" +%s)
          JITTER=$(( RANDOM % 601 ))   # 0 to 10 minutes, in seconds
          WAIT=$(( TARGET_TS - NOW + JITTER ))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT second(s) until 05:00 (+jitter)"
            sleep "$WAIT"
          else
            echo "Already past 05:00, checking right away"
          fi

      - name: Check and send apology if needed
        if: vars.SMS_ENABLED == 'true'
        run: python send_goodnight_apology.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          FORCE_PENDING: ${{ github.event.inputs.force_pending == 'true' && '1' || '' }}

      - name: Skipped (kill switch off)
        if: vars.SMS_ENABLED != 'true'
        run: echo "::warning::SMS sending is disabled (SMS_ENABLED is not 'true'). Nothing was sent."

      - name: Save state back to the repo
        if: vars.SMS_ENABLED == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory (goodnight apology) [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
