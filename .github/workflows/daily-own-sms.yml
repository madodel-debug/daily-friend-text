name: Daily SMS from My Phone
on:
  schedule:
    - cron: '30 21 * * *'   # 5:30 AM PH time (21:30 UTC previous day) - the window start
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Optional: pretend today is this date (MM-DD) to test birthdays'
        required: false
        default: ''
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install requests
      - name: Random delay (spreads sends across 5:30-8:00 AM PH)
        if: github.event_name == 'schedule'
        run: |
          MINUTES=$(( RANDOM % 150 ))   # 0 to 149 minutes, keeps it inside the 2.5 hour window
          echo "Sleeping $MINUTES minute(s) before sending"
          sleep "${MINUTES}m"
      - run: python send_daily_quote_own_phone.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          BIRTHDAYS: ${{ secrets.BIRTHDAYS }}
          TEST_DATE: ${{ github.event.inputs.test_date }}
