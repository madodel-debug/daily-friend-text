name: Good Night SMS
on:
  schedule:
    # Start ~20 minutes EARLY so GitHub's scheduler lag doesn't make us late.
    # The wait step below holds until 8:00 PM PH.
    - cron: '40 11 * * *'   # starts 7:40 PM PH, sends ~8:00 PM
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check monthly pause (2nd week = 8th to 14th)
        id: pause
        run: |
          export TZ=Asia/Manila
          DAY=$((10#$(date +%d)))
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DAY" -ge 8 ] && [ "$DAY" -le 14 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Paused: day $DAY falls in the 2nd week of the month (8th-14th). Nothing will be sent."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pause.outputs.paused != 'true'

      - uses: actions/setup-python@v5
        if: steps.pause.outputs.paused != 'true'
        with:
          python-version: '3.x'

      - run: pip install requests
        if: steps.pause.outputs.paused != 'true'

      - name: Wait until 8:00 PM PH (plus 0-10 min jitter)
        if: github.event_name == 'schedule' && vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: |
          export TZ=Asia/Manila
          NOW=$(date +%s)
          TARGET_TS=$(date -d "$(date +%F) 20:00" +%s)
          JITTER=$(( RANDOM % 601 ))   # 0 to 10 minutes, in seconds
          WAIT=$(( TARGET_TS - NOW + JITTER ))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT second(s) until 20:00 (+jitter)"
            sleep "$WAIT"
          else
            echo "Already past 20:00, sending right away"
          fi

      - name: Send good night SMS
        if: vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: python send_goodnight_sms.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}

      - name: Skipped (kill switch off)
        if: vars.SMS_ENABLED != 'true'
        run: echo "::warning::SMS sending is disabled (SMS_ENABLED is not 'true'). Nothing was sent."

      - name: Save no-repeat memory back to the repo
        if: vars.SMS_ENABLED == 'true' && steps.pause.outputs.paused != 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory (goodnight) [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
