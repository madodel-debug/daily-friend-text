name: Good Night SMS
on:
  schedule:
    # 10:00 PM PH time = 14:00 UTC. Random delay below spreads the actual
    # send across the 10:00-11:00 PM window.
    - cron: '0 14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Random delay (spreads the send across 10-11 PM)
        if: github.event_name == 'schedule'
        run: |
          MINUTES=$(( RANDOM % 60 ))   # 0 to 59 minutes -> sometime 10:00-11:00 PM PH
          echo "Sleeping $MINUTES minute(s) before sending"
          sleep "${MINUTES}m"

      - run: python send_goodnight_sms.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}

      - name: Save no-repeat memory back to the repo
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory (goodnight) [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
