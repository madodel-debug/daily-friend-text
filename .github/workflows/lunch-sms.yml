name: Lunch SMS (3 random weekdays)
on:
  schedule:
    # Start ~20 minutes EARLY so GitHub's scheduler lag doesn't make us late.
    # The wait step below holds until 10:30 AM PH.
    - cron: '10 2 * * 1-5'   # starts 10:10 AM PH, sends ~10:30 AM, Mon-Fri
  workflow_dispatch:
    inputs:
      test_weekday:
        description: 'Optional: pretend today is this weekday, 0=Mon..4=Fri'
        required: false
        default: ''
      force_send:
        description: 'Send even if today is not a chosen day? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Wait until 10:30 AM PH (plus 0-10 min jitter)
        if: github.event_name == 'schedule' && vars.SMS_ENABLED == 'true'
        run: |
          export TZ=Asia/Manila
          NOW=$(date +%s)
          TARGET_TS=$(date -d "$(date +%F) 10:30" +%s)
          JITTER=$(( RANDOM % 601 ))   # 0 to 10 minutes, in seconds
          WAIT=$(( TARGET_TS - NOW + JITTER ))
          if [ "$WAIT" -gt 0 ]; then
            echo "Waiting $WAIT second(s) until 10:30 (+jitter)"
            sleep "$WAIT"
          else
            echo "Already past 10:30, sending right away"
          fi

      - name: Send lunch SMS
        if: vars.SMS_ENABLED == 'true'
        run: python send_lunch_sms.py
        env:
          SMSGATEWAY_LOGIN: ${{ secrets.SMSGATEWAY_LOGIN }}
          SMSGATEWAY_PASSWORD: ${{ secrets.SMSGATEWAY_PASSWORD }}
          RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
          TEST_WEEKDAY: ${{ github.event.inputs.test_weekday }}
          FORCE_SEND: ${{ github.event.inputs.force_send == 'true' && '1' || '' }}

      - name: Skipped (kill switch off)
        if: vars.SMS_ENABLED != 'true'
        run: echo "::warning::SMS sending is disabled (SMS_ENABLED is not 'true'). Nothing was sent."

      - name: Save no-repeat memory back to the repo
        if: vars.SMS_ENABLED == 'true'
        run: |
          git fetch origin main
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain sent_state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_state.json
            git commit -m "Update sent-message memory (lunch) [skip ci]"
            git push
          else
            echo "No change to sent_state.json, nothing to commit."
          fi
